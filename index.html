const dayNum = (d) => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));
const isoDay = (t) => new Date(t).toISOString().slice(0, 10);
const byTitle = (a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: "base" });
const iaDetails = (id) => `https://archive.org/details/${encodeURIComponent(id)}`;
const iaFile = (a) => `https://archive.org/download/${encodeURIComponent(a.id)}/${a.file.split("/").map(encodeURIComponent).join("/")}`;

const songs = DATA.songs;
songs.forEach((s, i) => { s.i = i; s.t = dayNum(s.date); s.authorNames = s.authors.map((a) => a.name); });
const byShow = new Map();
for (const s of songs) { if (!byShow.has(s.show)) byShow.set(s.show, []); byShow.get(s.show).push(s); }
const kindSet = new Set(songs.map((s) => s.kind));
const presentKinds = [...KINDS.filter((k) => kindSet.has(k)), ...[...kindSet].filter((k) => !KINDS.includes(k))];
const presentEras = ERA_NAMES.filter((e) => songs.some((s) => s.era === e));
const eraInfo = Object.fromEntries(DATA.eras.map((e) => [e.name, e]));

const initial = () => ({ eras: new Set(presentEras), kinds: new Set(presentKinds), author: "", q: "", range: null, sort: { key: "date", dir: 1 }, sel: null });
let state = initial();

function eraTitle(e) {
  if (e === "Between") return "Between eras: the fall-2005 drummer search and the fall-2025 transition";
  const r = eraInfo[e];
  return `${e} Era · ${r.drummer} · ${r.start ? fmt(r.start) : "start"} – ${r.end ? fmt(r.end) : "present"}`;
}

const isDebutAudio = (s) => s.audio && s.audio.how !== "later";
const playableDebut = songs.filter(isDebutAudio).length, playableLater = songs.filter((s) => s.audio && !isDebutAudio(s)).length;
document.getElementById("sub").innerHTML =
  `The Disco Biscuits · ${songs.length} songs at the show where each was first played · archive.org audio for ${playableDebut} debuts, ` +
  `plus the earliest later recording for ${playableLater} more · data: ` +
  `<a href="${DATA.site}/songs" target="_blank" rel="noopener">Biscuits Internet Project</a>, pulled ${esc(DATA.fetched)}`;
document.getElementById("foot").textContent =
  "Era boundaries match BIP's own Sammy/Allen/Marlon filters. Song and show links open on BIP.";

// ---------- filtering ----------
function matches(s, skip) {
  if (skip !== "era" && !state.eras.has(s.era)) return false;
  if (skip !== "kind" && !state.kinds.has(s.kind)) return false;
  if (skip !== "author" && state.author) {
    if (state.author === NO_AUTHOR ? s.authors.length : !s.authorNames.includes(state.author)) return false;
  }
  if (state.q && !s.title.toLowerCase().includes(state.q)) return false;
  if (skip !== "range" && state.range && (s.t < state.range[0] || s.t > state.range[1])) return false;
  return true;
}

// ---------- controls ----------
function chip(container, key, label, color, setName) {
  const b = document.createElement("button");
  b.className = "chip"; b.dataset.key = key;
  b.innerHTML = `<span class="sw" style="background:${color}"></span>${esc(label)} <span class="n"></span>`;
  b.addEventListener("click", (ev) => {
    const set = state[setName];
    // Shift/alt-click isolates a single value; plain click toggles.
    if (ev.shiftKey || ev.altKey) { set.clear(); set.add(key); }
    else if (set.has(key)) set.delete(key); else set.add(key);
    render();
  });
  container.appendChild(b);
  return b;
}
const erasEl = document.getElementById("eras"), kindsEl = document.getElementById("kinds");
presentEras.forEach((e) => (chip(erasEl, e, ERA_LABEL[e].replace(" Era", ""), eraColor(e), "eras").title = eraTitle(e)));
presentKinds.forEach((k) => chip(kindsEl, k, KIND_LABEL[k] || k, kindColor(k), "kinds"));

const authorEl = document.getElementById("author");
authorEl.addEventListener("change", () => { state.author = authorEl.value; render(); });
const qEl = document.getElementById("q");
qEl.addEventListener("input", () => { state.q = qEl.value.trim().toLowerCase(); render(); });
const rangeEl = document.getElementById("range");
rangeEl.addEventListener("click", () => setRange(null));
document.getElementById("reset").addEventListener("click", () => { state = initial(); qEl.value = ""; render(); });

function setRange(r) { state.range = r; render(); }
function setAuthor(name) { state.author = name; render(); }

function updateControls() {
  const eraN = {}, kindN = {}, authN = new Map();
  let noAuth = 0, authTotal = 0;
  for (const s of songs) {
    if (matches(s, "era")) eraN[s.era] = (eraN[s.era] || 0) + 1;
    if (matches(s, "kind")) kindN[s.kind] = (kindN[s.kind] || 0) + 1;
    if (matches(s, "author")) {
      authTotal++;
      if (!s.authors.length) noAuth++;
      for (const a of s.authorNames) authN.set(a, (authN.get(a) || 0) + 1);
    }
  }
  erasEl.querySelectorAll(".chip").forEach((b) => {
    b.setAttribute("aria-pressed", state.eras.has(b.dataset.key)); b.querySelector(".n").textContent = eraN[b.dataset.key] || 0;
  });
  kindsEl.querySelectorAll(".chip").forEach((b) => {
    b.setAttribute("aria-pressed", state.kinds.has(b.dataset.key)); b.querySelector(".n").textContent = kindN[b.dataset.key] || 0;
  });
  if (state.author && state.author !== NO_AUTHOR && !authN.has(state.author)) authN.set(state.author, 0);
  const opts = [...authN].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  authorEl.innerHTML =
    `<option value="">All authors (${authTotal})</option>` +
    opts.map(([n, c]) => `<option value="${esc(n)}">${esc(n)} (${c})</option>`).join("") +
    (noAuth || state.author === NO_AUTHOR ? `<option value="${NO_AUTHOR}">(no author listed) (${noAuth})</option>` : "");
  authorEl.value = state.author;
  rangeEl.classList.toggle("on", !!state.range);
  if (state.range) rangeEl.innerHTML = `${esc(rangeLabel(state.range))} <span class="n">✕</span>`;
}

function rangeLabel([a, b]) {
  const da = isoDay(a), db = isoDay(b);
  if (da.slice(5) === "01-01" && db.slice(5) === "12-31" && da.slice(0, 4) === db.slice(0, 4)) return da.slice(0, 4);
  if (da.slice(5) === "01-01" && db.slice(5) === "12-31") return `${da.slice(0, 4)}–${db.slice(0, 4)}`;
  return `${fmtShort(da)} – ${fmtShort(db)}`;
}

// ---------- chart ----------
const svg = document.getElementById("chart");
const tip = document.getElementById("tip");
const NS = "http://www.w3.org/2000/svg";
const CELL = 7, PITCH = 8, TOP = 26, AXIS = 24;
const firstYear = +songs[0].date.slice(0, 4), lastYear = +songs[songs.length - 1].date.slice(0, 4);
const T0 = Date.UTC(firstYear, 0, 1), T1 = Date.UTC(lastYear + 1, 0, 1);
let geo = null; // { W, L, R, base } of the last render, for pointer → time conversion

function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const xOf = (t) => geo.L + ((t - T0) / (T1 - T0)) * (geo.W - geo.L - geo.R);
const tOf = (x) => Math.min(T1 - 1, Math.max(T0, T0 + ((x - geo.L) / (geo.W - geo.L - geo.R)) * (T1 - T0)));

function renderChart(list) {
  const W = Math.max(document.getElementById("chart-wrap").clientWidth - 12, 900);
  geo = { W, L: 6, R: 6, base: 0 };

  // Greedy stacking in date order: each square takes the lowest row whose last square ends left of it.
  const rowEnd = [], pos = [];
  for (const s of list) {
    const cx = xOf(s.t) - CELL / 2;
    let r = 0;
    while (r < rowEnd.length && rowEnd[r] > cx - 1) r++;
    rowEnd[r] = cx + CELL;
    pos.push([s, cx, r]);
  }
  const rows = Math.max(rowEnd.length, 8);
  const base = TOP + rows * PITCH;
  geo.base = base;
  const H = base + AXIS;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.replaceChildren();

  for (const e of DATA.eras) {
    const a = xOf(e.start ? dayNum(e.start) : T0), b = xOf(e.end ? dayNum(e.end) : T1);
    const on = state.eras.has(e.name);
    el("rect", { x: a, y: 0, width: b - a, height: base, fill: eraColor(e.name), "fill-opacity": on ? 0.09 : 0.03 }, svg);
    el("line", { x1: a, x2: a, y1: 0, y2: base, stroke: eraColor(e.name), "stroke-opacity": 0.5 }, svg);
    const t = el("text", { x: a + 6, y: 16, fill: eraColor(e.name), "font-size": 12, "font-weight": 700, opacity: on ? 1 : 0.4 }, svg);
    t.textContent = `${e.name.toUpperCase()} ERA · ${e.drummer}`;
    // A band too narrow for its label (Marlon, at the right edge) gets the label pulled left, ending at the chart edge.
    if (a + 6 + t.getComputedTextLength() > W - geo.R - 4) { t.setAttribute("x", W - geo.R - 4); t.setAttribute("text-anchor", "end"); }
  }
  for (let y = firstYear; y <= lastYear + 1; y++) {
    const xx = xOf(Date.UTC(y, 0, 1));
    el("line", { x1: xx, x2: xx, y1: base, y2: base + 5, stroke: "#555" }, svg);
    if (y <= lastYear) {
      const lbl = el("text", { class: "yr", x: xOf(Date.UTC(y, 6, 1)), y: base + 17, fill: "#8b8f9c", "font-size": 11, "text-anchor": "middle", "data-year": y }, svg);
      lbl.textContent = W < 1100 ? "'" + String(y).slice(2) : y;
    }
  }
  el("line", { x1: geo.L, x2: W - geo.R, y1: base, y2: base, stroke: "#555" }, svg);

  const g = el("g", {}, svg);
  const r = state.range;
  for (const [s, cx, row] of pos) {
    const inRange = !r || (s.t >= r[0] && s.t <= r[1]);
    el("rect", {
      class: "song" + (s.i === state.sel ? " hl" : ""), x: cx, y: base - (row + 1) * PITCH + 1, width: CELL, height: CELL, rx: 1.5,
      fill: kindColor(s.kind), "fill-opacity": inRange ? 1 : 0.18, "data-i": s.i,
    }, g);
  }
  if (r) {
    const a = xOf(r[0]), b = xOf(r[1] + 86400000);
    el("rect", { x: a, y: 0, width: Math.max(b - a, 2), height: base, fill: "none", stroke: css("--original"), "stroke-dasharray": "4 3", "pointer-events": "none" }, svg);
  }
  if (!list.length) {
    const t = el("text", { x: W / 2, y: TOP + 30, fill: "#8b8f9c", "text-anchor": "middle" }, svg);
    t.textContent = "No debuts match these filters";
  }
}

const localX = (ev) => ev.clientX - svg.getBoundingClientRect().left;
let drag = null;
svg.addEventListener("pointerdown", (ev) => {
  if (ev.button !== 0 || ev.target.dataset.i !== undefined) return;
  svg.setPointerCapture(ev.pointerId);
  const x = localX(ev);
  // Pointer capture retargets pointerup to the svg, so remember what was pressed now.
  drag = { x0: x, year: ev.target.dataset.year, box: el("rect", { x, y: 0, width: 0, height: geo.base, fill: css("--original"), "fill-opacity": 0.12, stroke: css("--original"), "pointer-events": "none" }, svg) };
});
svg.addEventListener("pointermove", (ev) => {
  if (drag) {
    const x = localX(ev);
    drag.box.setAttribute("x", Math.min(x, drag.x0)); drag.box.setAttribute("width", Math.abs(x - drag.x0));
    return;
  }
  const i = ev.target.dataset && ev.target.dataset.i;
  if (i === undefined) { tip.style.display = "none"; return; }
  const s = songs[+i];
  tip.innerHTML =
    `<b>${esc(s.title)}</b> <span class="badge" style="background:${kindColor(s.kind)}">${esc(KIND_LABEL[s.kind] || s.kind)}</span><br>` +
    `<span class="m">by</span> ${esc(s.authorNames.join(", ") || "no author listed")}<br>` +
    `${fmt(s.date)} · <span class="m">${esc(ERA_LABEL[s.era])}</span><br>` +
    (s.audio ? (isDebutAudio(s)
      ? `<span style="color:var(--original)">▶ debut recording on archive.org</span><br>`
      : `<span class="m">▶ earliest recording ${fmtShort(s.audio.date)} (not the debut)</span><br>`) : "") +
    `${esc(s.venue)}${s.place ? `, <span class="m">${esc(s.place)}</span>` : ""}`;
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - w - 8) + "px";
  tip.style.top = (ev.clientY + 14 + h > innerHeight ? ev.clientY - h - 10 : ev.clientY + 14) + "px";
});
svg.addEventListener("pointerup", (ev) => {
  if (!drag) return;
  const x0 = drag.x0, x1 = localX(ev), yr = drag.year;
  drag.box.remove(); drag = null;
  if (Math.abs(x1 - x0) >= 4) {
    const a = tOf(Math.min(x0, x1)), b = tOf(Math.max(x0, x1));
    setRange([dayNum(isoDay(a)), dayNum(isoDay(b))]);
    return;
  }
  // A click: on the axis selects that year; on empty chart space clears the range.
  if (yr) setRange([Date.UTC(+yr, 0, 1), Date.UTC(+yr, 11, 31)]);
  else if (state.range) setRange(null);
});
svg.addEventListener("mouseleave", () => (tip.style.display = "none"));
svg.addEventListener("click", (ev) => {
  const i = ev.target.dataset && ev.target.dataset.i;
  if (i !== undefined) select(+i, true);
});

// ---------- year tabs ----------
// Tabs are a view of state.range, not their own filter: a tab is selected only when the range is exactly
// that calendar year, "All" when there is no range, and nothing when a dragged range spans something else.
const yearsEl = document.getElementById("years");
const yearRange = (y) => [Date.UTC(y, 0, 1), Date.UTC(y, 11, 31)];
const eraOf = (d) => {
  for (const e of DATA.eras) if ((!e.start || d >= e.start) && (!e.end || d <= e.end)) return e.name;
  return "Between";
};
// Underline coloured by which era(s) the year's days belong to, so 2005 and 2025 show their hand-offs.
function eraGradient(y) {
  const cuts = new Set([`${y}-01-01`, `${y + 1}-01-01`]);
  for (const e of DATA.eras) {
    if (e.start && e.start.startsWith(String(y))) cuts.add(e.start);
    if (e.end && e.end.startsWith(String(y))) cuts.add(isoDay(dayNum(e.end) + 86400000));
  }
  const pts = [...cuts].sort(), span = dayNum(pts[pts.length - 1]) - dayNum(pts[0]);
  const stops = [];
  for (let k = 0; k < pts.length - 1; k++) {
    const c = eraColor(eraOf(pts[k]));
    const a = ((dayNum(pts[k]) - dayNum(pts[0])) / span) * 100, b = ((dayNum(pts[k + 1]) - dayNum(pts[0])) / span) * 100;
    stops.push(`${c} ${a.toFixed(1)}%`, `${c} ${b.toFixed(1)}%`);
  }
  return stops.length === 2 ? stops[0].split(" ")[0] : `linear-gradient(90deg, ${stops.join(", ")})`;
}
const yearTabs = [];
function addTab(year) {
  const b = document.createElement("button");
  b.className = "ytab" + (year === null ? " all" : "");
  b.setAttribute("role", "tab");
  b.innerHTML = `<span class="y">${year === null ? "All" : year}</span><span class="n"></span>` + (year === null ? "" : `<span class="u" style="background:${eraGradient(year)}"></span>`);
  b.addEventListener("click", () => chooseYear(year));
  yearsEl.appendChild(b);
  yearTabs.push({ year, el: b });
}
addTab(null);
for (let y = firstYear; y <= lastYear; y++) addTab(y);

function activeYear() {
  if (!state.range) return null;
  const y = new Date(state.range[0]).getUTCFullYear(), [a, b] = yearRange(y);
  return state.range[0] === a && state.range[1] === b ? y : undefined; // undefined = custom range
}
function chooseYear(year, focus) {
  const tab = yearTabs.find((t) => t.year === year);
  if (tab.el.getAttribute("aria-disabled") === "true") return;
  setRange(year === null ? null : yearRange(year));
  if (focus) tab.el.focus();
}
let lastScrolledYear;
function updateYearTabs() {
  const perYear = {};
  let total = 0;
  for (const s of songs) if (matches(s, "range")) { total++; perYear[s.date.slice(0, 4)] = (perYear[s.date.slice(0, 4)] || 0) + 1; }
  const active = activeYear();
  for (const { year, el } of yearTabs) {
    const n = year === null ? total : perYear[year] || 0;
    const selected = year === active;
    el.querySelector(".n").textContent = n;
    el.setAttribute("aria-selected", selected);
    el.setAttribute("aria-disabled", !n && !selected);
    el.tabIndex = selected || (active === undefined && year === null) ? 0 : -1;
    el.title = year === null ? "All years" : `${year}: ${n} debut${n === 1 ? "" : "s"} matching the current filters`;
  }
  if (active !== lastScrolledYear) {
    lastScrolledYear = active;
    const t = yearTabs.find((t) => t.year === active);
    if (t && active !== null) yearsEl.scrollTo({ left: t.el.offsetLeft - yearsEl.clientWidth / 2 + t.el.offsetWidth / 2, behavior: "smooth" });
  }
}
yearsEl.addEventListener("keydown", (ev) => {
  const moves = { ArrowRight: 1, ArrowLeft: -1, Home: -Infinity, End: Infinity };
  if (!(ev.key in moves)) return;
  ev.preventDefault();
  const enabled = yearTabs.filter((t) => t.el.getAttribute("aria-disabled") !== "true");
  const cur = enabled.findIndex((t) => t.el === document.activeElement);
  const step = moves[ev.key];
  const next = step === -Infinity ? 0 : step === Infinity ? enabled.length - 1 : Math.min(enabled.length - 1, Math.max(0, cur + step));
  chooseYear(enabled[next].year, true);
});

// ---------- table ----------
const rowsEl = document.getElementById("rows");
const listPane = document.getElementById("list-pane");
let order = []; // song indices in current table order, for keyboard navigation

const SORT = {
  date: (s) => s.t,
  title: (s) => s.title.toLowerCase(),
  kind: (s) => presentKinds.indexOf(s.kind),
  author: (s) => (s.authorNames[0] || "\uffff").toLowerCase(),
  venue: (s) => s.venue.toLowerCase(),
  plays: (s) => s.plays,
};
document.querySelectorAll("thead th").forEach((th) => th.addEventListener("click", () => {
  const k = th.dataset.k;
  state.sort = state.sort.key === k ? { key: k, dir: -state.sort.dir } : { key: k, dir: k === "plays" ? -1 : 1 };
  renderTable(current);
}));

function renderTable(list) {
  const { key, dir } = state.sort;
  const get = SORT[key];
  const sorted = [...list].sort((a, b) => {
    const va = get(a), vb = get(b);
    return (va < vb ? -1 : va > vb ? 1 : 0) * dir || a.t - b.t || byTitle(a, b);
  });
  document.querySelectorAll("thead th").forEach((th) => {
    if (th.dataset.k === key) th.setAttribute("aria-sort", dir > 0 ? "ascending" : "descending"); else th.removeAttribute("aria-sort");
  });
  order = sorted.map((s) => s.i);
  const perYear = {};
  if (key === "date") for (const s of list) perYear[s.date.slice(0, 4)] = (perYear[s.date.slice(0, 4)] || 0) + 1;
  const out = [];
  let year = null;
  for (const s of sorted) {
    if (key === "date" && s.date.slice(0, 4) !== year) {
      year = s.date.slice(0, 4);
      out.push(`<tr class="yr"><td colspan="6">${year}<span>${perYear[year]} debut${perYear[year] === 1 ? "" : "s"}</span></td></tr>`);
    }
    out.push(
      `<tr class="row${s.i === state.sel ? " sel" : ""}" data-i="${s.i}">` +
      `<td class="date" style="box-shadow:inset 3px 0 ${eraColor(s.era)}" title="${esc(ERA_LABEL[s.era])}">${fmtShort(s.date)}</td>` +
      `<td class="title"><div class="clip" title="${esc(s.title)}">` +
      (s.audio
        ? `<button class="play${isDebutAudio(s) ? "" : " later"}${s.i === playingI ? " on" : ""}" data-play="${s.i}" ` +
          `title="${isDebutAudio(s) ? "Play the debut (archive.org)" : `Play the earliest recording, ${fmtShort(s.audio.date)} (not the debut)`}">▶</button>`
        : `<span class="noplay"></span>`) +
      `<span class="sw mob" style="background:${kindColor(s.kind)}"></span>${esc(s.title)}</div></td>` +
      `<td class="kind c-kind"><span class="sw" style="background:${kindColor(s.kind)}"></span> ${esc(KIND_LABEL[s.kind] || s.kind)}</td>` +
      `<td class="author"><div class="clip" title="${esc(s.authorNames.join(", "))}">${s.authors.length ? esc(s.authorNames.join(", ")) : '<span class="m">—</span>'}</div></td>` +
      `<td class="c-venue"><div class="clip" title="${esc(s.venue + (s.place ? ", " + s.place : ""))}">${esc(s.venue)}${s.place ? ` <span class="m">· ${esc(s.place)}</span>` : ""}</div></td>` +
      `<td class="num c-plays">${s.plays}</td></tr>`
    );
  }
  rowsEl.innerHTML = out.join("") || `<tr><td colspan="6" class="empty">No debuts match these filters.</td></tr>`;
  document.getElementById("count").textContent = `${list.length} of ${songs.length} songs · ${new Set(list.map((s) => s.show)).size} shows`;
}
rowsEl.addEventListener("click", (ev) => {
  const btn = ev.target.closest("[data-play]");
  if (btn) { play(+btn.dataset.play); return; }
  const tr = ev.target.closest("tr.row");
  if (tr) select(+tr.dataset.i, false);
});
listPane.addEventListener("keydown", (ev) => {
  if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
  ev.preventDefault();
  if (!order.length) return;
  const at = order.indexOf(state.sel);
  const next = at < 0 ? 0 : Math.min(order.length - 1, Math.max(0, at + (ev.key === "ArrowDown" ? 1 : -1)));
  select(order[next], true);
});

// ---------- selection + detail ----------
const detailEl = document.getElementById("detail");

function select(i, scrollTable) {
  state.sel = i;
  rowsEl.querySelectorAll("tr.sel").forEach((tr) => tr.classList.remove("sel"));
  svg.querySelectorAll("rect.hl").forEach((r) => r.classList.remove("hl"));
  const tr = rowsEl.querySelector(`tr.row[data-i="${i}"]`);
  if (tr) { tr.classList.add("sel"); if (scrollTable) tr.scrollIntoView({ block: "nearest" }); }
  const sq = svg.querySelector(`rect.song[data-i="${i}"]`);
  if (sq) sq.classList.add("hl");
  renderDetail();
}

function songItem(s) {
  return `<li data-i="${s.i}"><span class="sw" style="background:${kindColor(s.kind)}"></span>` +
    `<span class="grow">${esc(s.title)} <span class="m">· ${esc(s.authorNames.join(", ") || "no author listed")}</span></span>` +
    (s.audio ? `<span style="color:var(${isDebutAudio(s) ? "--original" : "--muted"})" title="${isDebutAudio(s) ? "Debut recording available" : "Later recording available"}">▶</span>` : "") + `</li>`;
}

function recordingHtml(s) {
  const a = s.audio, rec = DATA.recordings[s.date];
  const playing = playingI === s.i;
  const trackLine = a && `archive.org track ${a.n}: “${esc(a.track)}”${a.length ? ` · ${esc(a.length)}` : ""} · ` +
    `<a href="${iaDetails(a.id)}" target="_blank" rel="noopener">recording ↗</a>`;
  const debutGap = rec
    ? `The debut show is on archive.org, but none of its tracks is titled “${esc(s.title)}”; it may sit inside a medley or an untitled jam ` +
      `(<a href="${iaDetails(rec)}" target="_blank" rel="noopener">browse it ↗</a>).`
    : `The debut show isn't on archive.org.`;
  if (a && a.how !== "later") {
    return `<h3>Debut recording</h3>` +
      `<button class="playbig" data-act="play">${playing ? "❚❚ Pause / resume" : "▶ Play the debut"}</button>` +
      `<div class="rec m">${trackLine}</div>` +
      (a.how === "setlist"
        ? `<div class="rec m">Found by setlist position: the recording doesn't title this track as the song, but it sits exactly where BIP's setlist puts it.</div>`
        : "");
  }
  if (a) {
    return `<h3>Earliest recording on archive.org</h3>` +
      `<div class="m" style="margin-bottom:8px">Not the debut. ${debutGap}</div>` +
      `<button class="playbig later" data-act="play">${playing ? "❚❚ Pause / resume" : `▶ Play ${fmt(a.date)}`}</button>` +
      `<div class="rec m"><a href="${DATA.site}/shows/${esc(a.show)}" target="_blank" rel="noopener">${esc(a.venue)}</a>${a.place ? `, ${esc(a.place)}` : ""}</div>` +
      `<div class="rec m">${trackLine}</div>`;
  }
  return `<h3>Debut recording</h3><div class="m">${rec ? debutGap : "No recording of this show on archive.org."}` +
    `${s.plays > 1 ? " No later recording has a track titled as this song either." : ""}</div>`;
}

function renderDetail() {
  if (state.sel !== null) {
    const s = songs[state.sel];
    const night = byShow.get(s.show).filter((o) => o !== s).sort(byTitle);
    const era = eraInfo[s.era];
    detailEl.innerHTML =
      `<button class="linkbtn close" data-act="close">close ✕</button>` +
      `<span class="badge" style="background:${kindColor(s.kind)}">${esc(KIND_LABEL[s.kind] || s.kind)}</span>` +
      `<h2><a href="${DATA.site}/songs/${esc(s.slug)}" target="_blank" rel="noopener">${esc(s.title)} ↗</a></h2>` +
      `<div class="m">by ${s.authors.length ? s.authors.map((a) => `<a href="${DATA.site}${esc(a.href)}" target="_blank" rel="noopener">${esc(a.name)}</a>`).join(", ") : "no author listed"}</div>` +
      `<dl class="facts">` +
      `<dt>First played</dt><dd>${fmt(s.date)}</dd>` +
      `<dt>Venue</dt><dd><a href="${DATA.site}/shows/${esc(s.show)}" target="_blank" rel="noopener">${esc(s.venue)}</a>${s.place ? `<br><span class="m">${esc(s.place)}</span>` : ""}</dd>` +
      `<dt>Era</dt><dd><span class="sw" style="background:${eraColor(s.era)}"></span> ${esc(ERA_LABEL[s.era])}${era ? ` <span class="m">· ${esc(era.drummer)}</span>` : ""}</dd>` +
      `<dt>Times played</dt><dd>${s.plays}</dd>` +
      `</dl>` +
      recordingHtml(s) +
      (night.length
        ? `<h3>Also debuted that night (${night.length})</h3><ul class="items">${night.map(songItem).join("")}</ul>`
        : `<h3>Also debuted that night</h3><div class="m">Nothing else. This was the only debut at this show.</div>`);
    return;
  }

  // Nothing selected: summarise whatever the filters and range currently cover.
  const list = current;
  const shows = new Set(list.map((s) => s.show)).size;
  const kindN = {}, eraN = {}, authN = new Map(), nightN = new Map();
  for (const s of list) {
    kindN[s.kind] = (kindN[s.kind] || 0) + 1;
    eraN[s.era] = (eraN[s.era] || 0) + 1;
    for (const a of s.authorNames) authN.set(a, (authN.get(a) || 0) + 1);
    nightN.set(s.show, (nightN.get(s.show) || 0) + 1);
  }
  const bars = (counts, keys, label, color) => keys.filter((k) => counts[k]).map((k) =>
    `<div class="bar"><span>${esc(label(k))}</span><div class="track"><div class="fill" style="width:${(100 * counts[k]) / list.length}%;background:${color(k)}"></div></div><span class="n">${counts[k]}</span></div>`
  ).join("");
  const topAuthors = [...authN].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 6);
  const topNights = [...nightN].sort((a, b) => b[1] - a[1] || byShow.get(a[0])[0].t - byShow.get(b[0])[0].t).slice(0, 6);
  detailEl.innerHTML = !list.length ? `<div class="empty">No debuts match these filters.</div>` :
    `<div class="big">${list.length}</div><div class="m">song debut${list.length === 1 ? "" : "s"} across ${shows} show${shows === 1 ? "" : "s"}` +
    `${state.range ? ` · ${esc(rangeLabel(state.range))}` : ""}. Select a song for details.</div>` +
    `<h3>By type</h3>${bars(kindN, presentKinds, (k) => KIND_LABEL[k] || k, kindColor)}` +
    `<h3>By era</h3>${bars(eraN, presentEras, (e) => ERA_LABEL[e], eraColor)}` +
    (topAuthors.length && !state.author ? `<h3>Top authors</h3><ul class="items">${topAuthors.map(([n, c]) =>
      `<li data-author="${esc(n)}"><span class="grow">${esc(n)}</span><span class="n">${c}</span></li>`).join("")}</ul>` : "") +
    `<h3>Biggest debut nights</h3><ul class="items">${topNights.map(([slug, c]) => {
      const first = byShow.get(slug)[0];
      return `<li data-i="${list.find((s) => s.show === slug).i}"><span class="grow">${fmtShort(first.date)} <span class="m">· ${esc(first.venue)}</span></span><span class="n">${c}</span></li>`;
    }).join("")}</ul>`;
}
detailEl.addEventListener("click", (ev) => {
  if (ev.target.closest("[data-act=close]")) { state.sel = null; select(null, false); return; }
  if (ev.target.closest("[data-act=play]")) { play(state.sel); return; }
  const li = ev.target.closest("li");
  if (!li) return;
  if (li.dataset.author) setAuthor(li.dataset.author);
  else if (li.dataset.i !== undefined) select(+li.dataset.i, true);
});

// ---------- player ----------
// One persistent <audio> outside the re-rendered panes, so playback survives selection and filter changes.
const playerEl = document.getElementById("player"), audioEl = document.getElementById("audio");
const npTitle = document.getElementById("np-title"), npMeta = document.getElementById("np-meta"), npLink = document.getElementById("np-link");
let playingI = null;
function play(i) {
  const s = songs[i];
  if (!s.audio) return;
  if (playingI === i) { if (audioEl.paused) audioEl.play().catch(() => {}); else audioEl.pause(); return; }
  playingI = i;
  audioEl.src = iaFile(s.audio);
  const debut = isDebutAudio(s);
  npTitle.textContent = debut ? `${s.title} — debut, ${fmt(s.date)}` : `${s.title} — ${fmt(s.audio.date)} (not the debut)`;
  npMeta.textContent = (debut ? `${s.venue}${s.place ? ", " + s.place : ""}` : `${s.audio.venue}${s.audio.place ? ", " + s.audio.place : ""}`) +
    ` · archive.org track ${s.audio.n}: ${s.audio.track}`;
  npLink.href = iaDetails(s.audio.id);
  playerEl.hidden = false;
  document.body.classList.add("playing");
  audioEl.play().catch(() => {}); // if the browser blocks autoplay, the visible controls still work
  markPlaying();
}
function markPlaying() {
  rowsEl.querySelectorAll(".play").forEach((b) => b.classList.toggle("on", +b.dataset.play === playingI));
  if (state.sel !== null) renderDetail();
}
audioEl.addEventListener("error", () => { if (playingI !== null) npMeta.textContent = "archive.org didn't serve this file. Try the full show link."; });
document.getElementById("np-close").addEventListener("click", () => {
  audioEl.pause(); audioEl.removeAttribute("src"); audioEl.load();
  playingI = null; playerEl.hidden = true; document.body.classList.remove("playing");
  markPlaying();
});

// ---------- render ----------
let current = songs;
function render() {
  current = songs.filter((s) => matches(s));
  updateControls();
  updateYearTabs();
  renderChart(songs.filter((s) => matches(s, "range")));
  renderTable(current);
  renderDetail();
}
let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => renderChart(songs.filter((s) => matches(s, "range"))), 120); });
render();
</script>
</body>
</html>
